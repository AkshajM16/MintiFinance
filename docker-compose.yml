x-app: &app
  build:
    context: .
    args:
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
  image: minti-v2:local
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    DEBUG: "False"
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minti}
      POSTGRES_DB: ${POSTGRES_DB:-minti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn minti.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile /dev/null"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    command: ["python", "manage.py", "consume_alerts"]
    depends_on:
      app:
        condition: service_healthy
volumes:
  postgres_data:
