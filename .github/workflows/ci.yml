name: Minti CI
on:
  push:
    branches: [main, feature/minti-cloud-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: minti_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: minti_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U minti_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'True'
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: minti_test
      POSTGRES_PASSWORD: synthetic-ci-only
      POSTGRES_DB: minti_test
      ALLOW_SYNTHETIC_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest -q --junitxml=results/pytest-ci.xml
      - run: ruff check backend scripts --select E9,F63,F7,F82
      - run: pip-audit --no-deps --disable-pip -r requirements.lock
      - run: npm ci
      - run: npm run lint && npm run build && npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: python scripts/run_e2e.py
      - run: npm --prefix infra ci && npm --prefix infra run build && npm --prefix infra test && npm --prefix infra run synth
      - run: cfn-lint infra/cdk.out/MintiV2.template.json
      - run: docker build -t minti-v2:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            results/
            test-results/
